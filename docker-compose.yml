# Broom365 as one container, for trying it out or developing.
#
#   docker compose up --build        ->  http://localhost:5000
#
# The page opens the installer: it asks where the data goes (SQL Server or SQLite), for an encryption key and the admin password. What it
# saves, and a SQLite file if you choose one, live in the `broom-data` volume.
#
# To try SQL Server without having one, start the optional throw-away server too, then use these values in the installer:
# server `mssql`, port 1433, database `broom365`, user `sa` and the password you set here:
#
#   MSSQL_SA_PASSWORD='Choose-a-Str0ng-one!' docker compose --profile mssql up --build
services:
  broom365:
    build: .
    image: broom365:latest
    ports:
      - "5000:5000"
    volumes:
      - broom-data:/app/instance
    restart: unless-stopped

  mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Creates the empty database once; Broom365 creates its tables when you install.
  mssql-init:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    command: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\"
      -Q \"IF DB_ID('broom365') IS NULL CREATE DATABASE broom365\""
    restart: "no"

volumes:
  broom-data:
  mssql-data:
