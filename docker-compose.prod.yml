# Broom365 in production: the image on its own and one volume. Paste it into a Portainer stack, or run
# `docker compose -f docker-compose.prod.yml up -d`.
#
# Set one variable, BROOM_IMAGE, to the image you built or pulled (for example yourname/yourrepo:broom365-1.1.1; log in to the registry
# first when it is private). Or replace `${BROOM_IMAGE:?...}` below with the image name.
#
# Then open http://host:5000: the installer asks for the database (SQL Server or SQLite), an encryption key and the admin password, and
# what it saves lives in the volume. Keep that volume.
services:
  broom365:
    image: ${BROOM_IMAGE:?set BROOM_IMAGE to the image to run}
    ports:
      - "5000:5000"
    volumes:
      - broom-data:/app/instance
    restart: unless-stopped

volumes:
  broom-data:
